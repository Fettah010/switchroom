<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Switchroom is a local-first A/B audio player. Compare an Original and an Edited recording on one synchronized timeline, with a real crossfade. Your audio never leaves your browser."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08090b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Switchroom — hear the difference</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('switchroom.theme');
          var mode = stored === 'dark' || stored === 'light' ? stored : 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#08090b' : '#f4f1e9');
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui; color: #f2f2ef; background: #08090b">
        Switchroom needs JavaScript to play and compare local audio files.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
