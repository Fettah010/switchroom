name: Bug report
description: Report a reproducible problem with Switchroom
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach personal or unreleased audio. A synthetic reproduction or a short description of the file format is enough.

        For security issues, use the private vulnerability reporting flow instead of a public issue.

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 158.0.8127.18
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, iOS 19
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: File format involved
      options:
        - WAV
        - MP3
        - FLAC
        - AAC
        - M4A
        - No file / not format-specific
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Switchroom
        2. Load ...
        3. Press Play and switch to ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output or screenshots
      description: Remove file names or personal details if needed.
    validations:
      required: false
